# Деплой public/ на GitHub Pages. Сборки нет: публикуется каталог как есть.
# Перед публикацией проверяется, что версия релиза актуальна (php tools/release.php выполнен и закоммичен),
# иначе пользователи не получат обновление. Подробности — docs/DEPLOY.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; новый пуш отменяет незавершённый — публикуется последняя версия целиком.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Проверка версии релиза и APP_SHELL
        run: php tools/release.php --check

      - name: Отключить Jekyll
        run: touch public/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
